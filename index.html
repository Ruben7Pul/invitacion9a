<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Invitación XV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
</head>
<body>
  <div id="bg"></div>
  <div id="petals-layer"></div>

  <div id="portal">
    <div class="portal-inner">
      <span class="eyebrow gold-text">Una invitación encantada</span>
      <div class="gate-wrapper" id="gate-wrapper">
        <!-- Hoja izquierda -->
        <div class="gate-leaf gate-left">
          <svg viewBox="0 0 150 200" width="100%" height="100%">
            <defs>
              <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f5e6b8"/>
                <stop offset="50%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#8a6d1b"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect x="5" y="5" width="140" height="190" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>
            <rect x="12" y="12" width="126" height="176" rx="6" fill="none" stroke="rgba(255,215,0,0.2)" stroke-width="2"/>
            <rect x="25" y="20" width="8" height="160" rx="4" fill="url(#goldGrad)"/>
            <rect x="55" y="20" width="8" height="160" rx="4" fill="url(#goldGrad)"/>
            <rect x="85" y="20" width="8" height="160" rx="4" fill="url(#goldGrad)"/>
            <rect x="115" y="20" width="8" height="160" rx="4" fill="url(#goldGrad)"/>
            <rect x="15" y="40" width="120" height="6" rx="3" fill="url(#goldGrad)"/>
            <rect x="15" y="80" width="120" height="6" rx="3" fill="url(#goldGrad)"/>
            <rect x="15" y="120" width="120" height="6" rx="3" fill="url(#goldGrad)"/>
            <rect x="15" y="160" width="120" height="6" rx="3" fill="url(#goldGrad)"/>
            <circle cx="29" cy="43" r="6" fill="#e63946" stroke="#fff" stroke-width="1"/>
            <circle cx="59" cy="43" r="6" fill="#2ecc71" stroke="#fff" stroke-width="1"/>
            <circle cx="89" cy="43" r="6" fill="#3498db" stroke="#fff" stroke-width="1"/>
            <circle cx="119" cy="43" r="6" fill="#f1c40f" stroke="#fff" stroke-width="1"/>
            <circle cx="29" cy="83" r="6" fill="#9b59b6" stroke="#fff" stroke-width="1"/>
            <circle cx="59" cy="83" r="6" fill="#e63946" stroke="#fff" stroke-width="1"/>
            <circle cx="89" cy="83" r="6" fill="#2ecc71" stroke="#fff" stroke-width="1"/>
            <circle cx="119" cy="83" r="6" fill="#3498db" stroke="#fff" stroke-width="1"/>
            <circle cx="29" cy="123" r="6" fill="#f1c40f" stroke="#fff" stroke-width="1"/>
            <circle cx="59" cy="123" r="6" fill="#9b59b6" stroke="#fff" stroke-width="1"/>
            <circle cx="89" cy="123" r="6" fill="#e63946" stroke="#fff" stroke-width="1"/>
            <circle cx="119" cy="123" r="6" fill="#2ecc71" stroke="#fff" stroke-width="1"/>
            <path d="M25 20 Q75 -15 125 20" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>
            <circle cx="75" cy="-5" r="10" fill="url(#goldGrad)" stroke="#fff" stroke-width="1"/>
            <rect x="65" y="90" width="20" height="25" rx="4" fill="#b8943c" stroke="#8a6d1b" stroke-width="2"/>
            <circle cx="75" cy="90" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
            <circle cx="75" cy="90" r="4" fill="#e63946"/>
          </svg>
        </div>
        <!-- Hoja derecha (reflejada) -->
        <div class="gate-leaf gate-right">
          <svg viewBox="0 0 150 200" width="100%" height="100%">
            <use href="#gate-left-svg" transform="scale(-1, 1) translate(-150, 0)" />
          </svg>
        </div>
        <div class="gate-brillos"></div>
      </div>
      <div class="portal-caption gold-text">Toca la reja para entrar</div>
    </div>
  </div>

  <!-- Script inline para manejar la reja -->
  <script>
    (function() {
      const gateWrapper = document.getElementById('gate-wrapper');
      if (gateWrapper) {
        console.log('✅ Reja encontrada en index.html');
        gateWrapper.addEventListener('click', function(e) {
          console.log('🔄 Clic en la reja detectado');
          e.preventDefault();
          // Añadir clase para animación de apertura
          this.classList.add('open');
          // Redirigir a principal.html después de 0.8s
          setTimeout(function() {
            window.location.href = 'principal.html';
          }, 800);
        });
      } else {
        console.error('❌ No se encontró #gate-wrapper en index.html');
      }
    })();
  </script>

  <!-- El script module ya no es necesario para la reja, pero lo dejamos por si acaso -->
  <script type="module" src="script.js"></script>
</body>
</html>
