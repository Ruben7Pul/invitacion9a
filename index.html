<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Mis XV años</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <!-- Capas de fondo -->
  <div id="bg"></div>
  <div id="stars"></div>
  <div id="petals-layer"></div>
  <div id="confetti-container"></div>
  <div id="cursor-layer"></div>

  <!-- Portal -->
  <div id="portal">
    <div class="portal-inner">
      <span class="eyebrow gold-text">Una invitación encantada</span>
      <button id="rose-btn" aria-label="Toca la rosa para comenzar">
        <svg viewBox="0 0 100 100"><!-- SVG de rosa --></svg>
      </button>
      <div class="portal-caption gold-text">Toca la rosa para comenzar</div>
    </div>
  </div>

  <!-- App principal -->
  <div id="app">
    <div id="app-top"><span class="eyebrow gold-text">Mis quince años</span></div>
    <div id="app-mid">
      <div id="rose-wrap"><!-- SVG rosa en frasco --></div>
      <div class="name-wrap"><h1 id="nombre-hero">X</h1></div>
      <p class="subt gold-text">Te invito a vivir un cuento hecho realidad</p>
      <p class="frase-inline gold-text" id="frase-texto">Cargando...</p>
      <p class="fecha-fija gold-text" id="fecha-fija">Cargando...</p>
    </div>
    <nav id="nav">
      <button class="nav-btn" data-modal="modal-contador"><svg>...</svg><span>Cuenta</span></button>
      <button class="nav-btn" data-modal="modal-detalles"><svg>...</svg><span>Lugares</span></button>
      <button class="nav-btn" data-modal="modal-familia"><svg>...</svg><span>Familia</span></button>
    </nav>
  </div>

  <button id="music-toggle">...</button>

  <!-- Modales -->
  <div class="modal-overlay" id="modal-contador">...</div>
  <div class="modal-overlay" id="modal-detalles">...</div>
  <div class="modal-overlay" id="modal-familia">...</div>

  <!-- Juego -->
  <div id="game-overlay">...</div>

  <!-- Módulos -->
  <script type="module" src="script.js"></script>
</body>
</html>
