  <!-- TRANSICIÓN MÁGICA (puerta/castillo) -->

      <video id="transition-video" muted playsinline preload="auto" poster="archivos/incbella-poster.jpg">

  <script type="module" src="script-portal.js"></script>

  <script>
    // Cortina de carga: se oculta apenas el video del portal esté listo
    const veilMain = document.getElementById('loading-veil-main');
    function ocultarVeil() {
      if (!veilMain || veilMain.style.opacity === '0') return;
      veilMain.style.opacity = '0';
      veilMain.style.pointerEvents = 'none';
      setTimeout(() => { veilMain.style.display = 'none'; }, 600);
    }
    if (veilMain) {
      const videoPortal = document.getElementById('video-portal');
      let intentos = 0;
      const maxIntentos = 50;
      const verificarCarga = setInterval(() => {
        intentos++;
        const listo = videoPortal && (videoPortal.readyState >= 2 || videoPortal.duration > 0);
        if (listo || intentos >= maxIntentos) {
          clearInterval(verificarCarga);
          ocultarVeil();
        }
      }, 100);
      window.addEventListener('load', () => { clearInterval(verificarCarga); ocultarVeil(); }, { once: true });
    }
  </script>
