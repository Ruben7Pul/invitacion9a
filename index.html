  <!-- Script inline para manejar la reja (APERTURA y CIERRE) -->
  <script>
    (function() {
      const gateWrapper = document.getElementById('gate-wrapper');
      const portal = document.getElementById('portal');
      const urlParams = new URLSearchParams(window.location.search);
      const isClosing = urlParams.has('closing');
      
      if (gateWrapper && portal) {
        // Detectar si venimos de una vuelta
        if (isClosing) {
          console.log('🚪 CERRANDO PUERTAS (animación inversa)');
          // Las puertas ya están abiertas, las cerramos suavemente
          setTimeout(function() {
            gateWrapper.classList.add('closing');
            console.log('🚪 Clase "closing" agregada - iniciando animación de cierre');
          }, 100);
        } else {
          console.log('✅ Reja en posición inicial de APERTURA');
        }
        
        // Listener para cuando haces click en las puertas (APERTURA)
        gateWrapper.addEventListener('click', function(e) {
          console.log('🔓 ¡ABRIENDO PUERTAS!');
          e.preventDefault();
          e.stopPropagation();
          
          // Evitar doble click
          if (this.classList.contains('open')) return;
          
          // 1. Animar puertas
          this.classList.add('open');
          console.log('🚪 Animación de apertura iniciada');
          
          // 2. Después de que empieza la apertura, fade out + zoom suave
          setTimeout(function() {
            portal.style.transition = 'opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            portal.style.opacity = '0';
            portal.style.transform = 'scale(1.05)';
            console.log('✨ Transición suave: zoom + fade');
          }, 300);
          
          // 3. Navegar cuando termina todo
          setTimeout(function() {
            console.log('🌹 Navegando a principal.html');
            window.location.href = 'principal.html';
          }, 1100);
        });
      } else {
        console.error('❌ No se encontró #gate-wrapper o #portal');
      }
    })();
  </script>
