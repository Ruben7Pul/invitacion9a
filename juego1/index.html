<!DOCTYPE html>
<html lang="es" style="background:#0e0a18;height:100%">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Juego XV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       ESTILOS DEL JUEGO – COMPLETO E INDEPENDIENTE
       ============================================================ */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%;
      overflow:hidden;
      background:#0e0a18;
      font-family:'Cinzel',serif;
    }

    /* Video de fondo (opcional) */
    #game-bg-video {
      position:fixed;
      inset:0;
      z-index:0;
      width:100%;
      height:100%;
      object-fit:cover;
      pointer-events:none;
      opacity:0.5;
      mix-blend-mode:screen;
    }

    @keyframes rainbowScore {
      0% { background-position:0% 50%; }
      100% { background-position:300% 50%; }
    }
    @keyframes heartFade {
      0% { opacity:1; transform:scale(1); }
      50% { opacity:0.5; transform:scale(1.5); color:#ff4444; }
      100% { opacity:0; transform:scale(0); }
    }
    @keyframes floatMsg {
      0% { opacity:0; transform:translate(-50%,30%) scale(0.5); }
      20% { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
      80% { opacity:1; transform:translate(-50%,-60%) scale(1); }
      100% { opacity:0; transform:translate(-50%,-80%) scale(0.8); }
    }

    #loading-veil {
      position:fixed;
      inset:0;
      z-index:999;
      background-color:#0e0a18;
      background-image:url('../archivos/bella.jpg');
      background-size:cover;
      background-position:center;
      opacity:1;
      transition:opacity 0.45s ease;
      pointer-events:none;
    }
    #loading-veil.hide { opacity:0; }

    #game-overlay {
      position:fixed;
      inset:0;
      z-index:90;
      background:rgba(6,4,10,0.85);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      visibility:hidden;
      transition:opacity 0.3s ease, visibility 0.3s ease;
    }
    #game-overlay.open {
      opacity:1;
      visibility:visible;
    }

    #game-panel {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0.5rem;
      transform:scale(0.9);
      opacity:0;
      transition:transform 0.3s ease, opacity 0.3s ease;
      max-width:96vw;
      z-index:10;
      position:relative;
    }
    #game-overlay.open #game-panel {
      transform:scale(1);
      opacity:1;
    }

    #game-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      font-family:'Cinzel',serif;
      text-transform:uppercase;
      font-size:clamp(0.7rem,2vw,0.9rem);
      padding:0 0.1rem;
      gap:0.05rem;
      color:#fae3a0;
      text-shadow:0 0 15px rgba(212,175,55,0.3);
    }
    #game-header span { white-space:nowrap; }
    #game-score {
      display:none;
      font-size:clamp(0.7rem,2vw,0.9rem);
      min-width:80px;
      text-align:center;
      flex-shrink:0;
      font-family:'Press Start 2P',monospace;
      background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#9b59b6);
      background-size:300% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      animation:rainbowScore 3s linear infinite;
      text-shadow:none;
    }
    #pause-btn {
      flex-shrink:0;
      background:rgba(201,162,77,0.12);
      border:1.5px solid #c9a24d;
      color:#f0d9a3;
      font-size:1.4rem;
      cursor:pointer;
      padding:0.2rem 0.5rem;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:30px;
      box-shadow:0 0 12px rgba(201,162,77,0.15);
      transition:all 0.3s ease;
      min-width:40px;
      height:40px;
    }
    #pause-btn:hover {
      background:rgba(201,162,77,0.25);
      box-shadow:0 0 20px rgba(201,162,77,0.3);
    }

    #game-stage {
      position:relative;
      background:#0e0a18;
      background-image:url('../archivos/jueg1.png');
      background-size:cover;
      background-position:center;
      border:2px solid #b8860b;
      border-radius:16px;
      overflow:hidden;
      touch-action:none;
      box-shadow:0 0 30px rgba(212,175,55,0.15), inset 0 0 40px rgba(25,60,120,0.2);
      width:100%;
      max-width:450px;
      aspect-ratio:300/420;
    }
    #game-inner {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:2;
    }

    /* LADRILLOS */
    .brick {
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:4px;
      transition:opacity 0.2s ease, transform 0.2s ease;
      will-change:transform, opacity;
      color:#fff;
      font-weight:bold;
      text-shadow:0 1px 2px rgba(0,0,0,0.5);
      border:1px solid rgba(0,0,0,0.25);
      box-shadow:inset 0 2px 4px rgba(255,255,255,0.15), inset 0 -2px 4px rgba(0,0,0,0.3);
    }
    .brick.gone { opacity:0; transform:scale(0.3); pointer-events:none; }
    .brick-clay { background:#d9534f; background:linear-gradient(145deg,#e57373,#c62828); box-shadow:inset 0 2px 4px rgba(255,200,200,0.3), inset 0 -2px 4px rgba(0,0,0,0.4); }
    .brick-wood { background:#8b5a2b; background:linear-gradient(145deg,#a67c52,#6d4c2a); box-shadow:inset 0 2px 4px rgba(255,220,180,0.3), inset 0 -2px 4px rgba(0,0,0,0.4); }
    .brick-wood.cracked-1 { background:#7a4f24; background:linear-gradient(145deg,#8b6b3e,#5a3d1a); box-shadow:inset 0 2px 4px rgba(255,220,180,0.2), inset 0 -2px 4px rgba(0,0,0,0.5); position:relative; overflow:hidden; }
    .brick-wood.cracked-1::after { content:''; position:absolute; top:10%; left:30%; width:2px; height:80%; background:rgba(0,0,0,0.4); transform:rotate(15deg); box-shadow:1px 0 2px rgba(0,0,0,0.2); }
    .brick-wood.cracked-1::before { content:''; position:absolute; top:20%; left:60%; width:2px; height:60%; background:rgba(0,0,0,0.3); transform:rotate(-10deg); }
    .brick-iron { background:#7a8a9a; background:linear-gradient(145deg,#9aa9b9,#5a6a7a); box-shadow:inset 0 2px 4px rgba(200,220,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.4); }
    .brick-iron.cracked-1 { background:#6a7a8a; background:linear-gradient(145deg,#7a8a9a,#4a5a6a); box-shadow:inset 0 2px 4px rgba(200,220,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.5); position:relative; overflow:hidden; }
    .brick-iron.cracked-1::after { content:''; position:absolute; top:5%; left:20%; width:2px; height:90%; background:rgba(0,0,0,0.5); transform:rotate(20deg); box-shadow:1px 0 2px rgba(0,0,0,0.3); }
    .brick-iron.cracked-1::before { content:''; position:absolute; top:15%; left:50%; width:2px; height:70%; background:rgba(0,0,0,0.4); transform:rotate(-15deg); }
    .brick-iron.cracked-2 { background:#5a6a7a; background:linear-gradient(145deg,#5a6a7a,#3a4a5a); box-shadow:inset 0 2px 4px rgba(200,220,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.6); position:relative; overflow:hidden; }
    .brick-iron.cracked-2::after { content:''; position:absolute; top:0; left:10%; width:2px; height:100%; background:rgba(0,0,0,0.6); transform:rotate(30deg); box-shadow:1px 0 3px rgba(0,0,0,0.3); }
    .brick-iron.cracked-2::before { content:''; position:absolute; top:10%; left:40%; width:2px; height:80%; background:rgba(0,0,0,0.5); transform:rotate(-20deg); box-shadow:1px 0 2px rgba(0,0,0,0.2); }
    .brick-iron.cracked-2 .crack-extra { position:absolute; top:5%; left:70%; width:2px; height:60%; background:rgba(0,0,0,0.4); transform:rotate(5deg); }

    #paddle, #ball {
      position:absolute;
      top:0;
      left:0;
      will-change:transform;
      transform-origin:0 0;
    }
    #paddle {
      height:12px;
      border-radius:8px;
      background:#111;
      border:2px solid #d4af37;
      box-shadow:0 0 25px rgba(212,175,55,0.3);
      z-index:100;
      pointer-events:none;
      top:406px;
    }
    #ball {
      width:12px;
      height:12px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #fff, #d68a96 60%, #a13545);
      box-shadow:0 0 12px rgba(255,200,200,0.5);
      z-index:11;
    }

    #game-msg {
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:0.5rem;
      background:rgba(10,7,16,0.85);
      text-align:center;
      padding:1rem;
      z-index:50;
    }
    #game-msg.show { display:flex; }
    #game-msg p {
      font-family:'Cinzel',serif;
      color:#fae3a0;
      font-size:clamp(1rem,3vw,1.3rem);
      white-space:pre-line;
      text-shadow:0 0 20px rgba(212,175,55,0.5);
    }

    .game-btn {
      font-family:'Cinzel',serif;
      font-size:clamp(0.8rem,2vw,1rem);
      letter-spacing:0.14em;
      text-transform:uppercase;
      color:#f0d9a3;
      background:rgba(201,162,77,0.15);
      border:1.5px solid rgba(201,162,77,0.4);
      padding:0.5rem 1.2rem;
      border-radius:30px;
      cursor:pointer;
      transition:all 0.3s ease;
      box-shadow:0 0 15px rgba(212,175,55,0.15);
      text-shadow:0 0 8px rgba(201,162,77,0.2);
      backdrop-filter:blur(4px);
    }
    .game-btn:hover {
      background:rgba(201,162,77,0.25);
      border-color:rgba(201,162,77,0.6);
      box-shadow:0 0 25px rgba(212,175,55,0.35);
      transform:translateY(-2px);
    }
    .game-btn:active { transform:translateY(0); background:rgba(201,162,77,0.2); }

    #game-menu {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:0.8rem;
      border-radius:16px;
      padding:1rem;
      position:absolute;
      inset:0;
      z-index:50;
      background:rgba(10,7,16,0.9);
      border:2px solid #b8860b;
      box-shadow:inset 0 0 60px rgba(25,60,120,0.3);
      overflow:hidden;
    }
    #menu-gameover {
      display:none;
      text-align:center;
      width:100%;
    }
    #menu-gameover p { font-family:'Cinzel',serif; }
    #gameover-score { font-size:1.1rem; color:#fae3a0; }
    #gameover-theme-msg {
      font-family:'Cormorant Garamond','Cinzel',serif;
      font-style:italic;
      font-size:clamp(0.8rem,2.4vw,0.95rem);
      color:#f0d9a3;
      text-shadow:0 0 10px rgba(212,175,55,0.25);
      max-width:280px;
      margin:0.4rem auto 0;
      line-height:1.4;
    }
    #gameover-input-container input {
      font-family:'Press Start 2P',monospace;
      background:#1a1a2e;
      border:2px solid #b8860b;
      border-radius:8px;
      color:white;
      padding:0.4rem;
    }
    #name-error { color:#ff6b6b; font-size:0.6rem; }

    #lives {
      display:none;
      letter-spacing:0.15em;
      font-size:clamp(1rem,3vw,1.3rem);
      color:#ff6b6b;
      text-shadow:0 0 15px #ff6b6b;
    }
    .heart-fade { animation:heartFade 0.6s ease forwards; }

    .game-help {
      font-size:clamp(0.7rem,2vw,0.9rem);
      opacity:0.8;
      margin-top:0.5rem;
      font-family:'Cinzel',serif;
      font-style:italic;
      text-shadow:0 0 10px rgba(201,162,77,0.2);
      color:#e0d0b0;
      text-align:center;
      line-height:1.6;
    }
    .game-help .highlight {
      color:#fae3a0;
      font-weight:bold;
    }

    /* MODAL DE PAUSA (sin perlas) */
    .pause-modal-overlay {
      position:absolute;
      inset:0;
      z-index:200;
      background:rgba(6,10,25,0.85);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1rem;
      opacity:0;
      visibility:hidden;
      transition:opacity 0.25s ease, visibility 0.25s ease;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      border-radius:16px;
    }
    .pause-modal-overlay.open {
      opacity:1;
      visibility:visible;
    }
    .pause-modal-card {
      width:100%;
      max-width:380px;
      max-height:85vh;
      overflow-y:auto;
      background:radial-gradient(ellipse at 50% 30%, #1c2a44, #0d1424 80%);
      border:3px solid #b8860b;
      border-radius:30px;
      padding:2rem 1.5rem;
      position:relative;
      transform:scale(0.95);
      opacity:0;
      transition:transform 0.2s ease, opacity 0.2s ease;
      box-shadow:0 0 0 2px rgba(184,134,11,0.2), 0 0 0 6px rgba(26,42,70,0.5), 0 0 50px rgba(184,134,11,0.12), inset 0 0 60px rgba(25,50,100,0.15);
      -webkit-overflow-scrolling:touch;
    }
    .pause-modal-overlay.open .pause-modal-card {
      transform:scale(1);
      opacity:1;
    }
    .pause-modal-card h2 {
      font-family:'Cinzel',serif;
      text-align:center;
      font-size:clamp(1.2rem,3vw,1.6rem);
      letter-spacing:0.15em;
      text-transform:uppercase;
      color:#fae3a0;
      text-shadow:0 0 25px rgba(212,175,55,0.3);
      margin:0 0 0.8rem;
      padding-bottom:0.5rem;
      border-bottom:2px solid rgba(212,175,55,0.2);
      position:relative;
    }
    .pause-modal-card .close-btn {
      position:absolute;
      top:0.6rem;
      right:0.6rem;
      width:36px;
      height:36px;
      border-radius:50%;
      background:rgba(212,175,55,0.06);
      border:1.5px solid #b8860b;
      color:#fae3a0;
      cursor:pointer;
      font-size:1.4rem;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:background 0.2s, color 0.2s;
      z-index:10;
      line-height:1;
      opacity:0.8;
    }
    .pause-modal-card .close-btn:hover {
      background:rgba(212,175,55,0.2);
      color:#ffffff;
      opacity:1;
    }
    .pause-modal-card .pause-ranking {
      margin:1rem 0;
      font-family:'Press Start 2P',monospace;
      font-size:0.7rem;
      color:#fae3a0;
    }
    .pause-modal-card .pause-ranking .rank-item {
      display:flex;
      justify-content:space-between;
      padding:0.3rem 0.2rem;
      border-bottom:1px solid rgba(212,175,55,0.15);
    }
    .pause-modal-card .pause-ranking .rank-item .pos {
      color:#d4af37;
      margin-right:0.5rem;
    }
    .pause-modal-card .pause-buttons {
      display:flex;
      flex-direction:column;
      gap:0.6rem;
      margin-top:1.2rem;
    }
    .pause-modal-card .pause-buttons .game-btn {
      width:100%;
      padding:0.6rem;
      font-size:clamp(0.8rem,1.8vw,1rem);
    }
    .pause-modal-card .pause-buttons .game-btn.exit-btn {
      border-color:#b8860b;
      color:#f0d9a3;
      background:rgba(201,162,77,0.08);
    }
    .pause-modal-card .pause-buttons .game-btn.exit-btn:hover {
      background:rgba(201,162,77,0.2);
      border-color:rgba(201,162,77,0.6);
    }

    /* Eliminar cualquier posible perla o adorno extra */
    .pause-modal-card::before,
    .pause-modal-card::after,
    #game-stage::before,
    #game-stage::after {
      display: none !important;
      content: none !important;
    }

    @media (max-width:400px) {
      #game-panel { max-width:98vw; }
      .game-btn { font-size:0.7rem; padding:0.3rem 0.8rem; }
      .pause-modal-card { padding:1rem 0.8rem; }
      #paddle { height:10px; width:50px; top:406px; }
      #ball { width:10px; height:10px; }
      .game-help { font-size:0.6rem; }
    }
    @media (min-width:768px) {
      #game-stage { max-width:450px; }
    }
  </style>
</head>
<body style="background:#0e0a18">
  <!-- Video de fondo (opcional) -->
  <video id="game-bg-video" autoplay loop muted playsinline style="display:none;" onerror="this.style.display='none'">
    <source src="../archivos/juegvideo.webm" type="video/webm">
    <source src="../archivos/juegvideo.mp4" type="video/mp4">
  </video>
  <script>
    // Intentar mostrar el video si existe
    (function() {
      var video = document.getElementById('game-bg-video');
      if (video) {
        video.style.display = 'block';
        video.play().catch(function() {
          video.style.display = 'none';
        });
        // Si falla la carga, ocultarlo
        video.addEventListener('error', function() {
          video.style.display = 'none';
        });
      }
    })();
  </script>

  <div id="loading-veil" aria-hidden="true"></div>
  <script>
    setTimeout(function () {
      var veil = document.getElementById('loading-veil');
      if (!veil) return;
      veil.classList.add('hide');
      veil.addEventListener('transitionend', function () {
        veil.style.display = 'none';
      }, { once: true });
    }, 750);
  </script>

  <div id="game-overlay" class="open">
    <div id="game-panel">
      <div id="game-header">
        <span id="lives">♥ ♥ ♥</span>
        <span id="game-score">0</span>
        <button id="pause-btn">⏸️</button>
      </div>

      <div id="game-stage">
        <div id="game-inner">
          <div id="paddle"></div>
          <div id="ball"></div>
        </div>

        <!-- Menú de game over -->
        <div id="game-menu" style="display:none;">
          <div id="menu-gameover">
            <p style="font-size:1.2rem; color:#ff6b6b;">GAME OVER</p>
            <p id="gameover-score">Puntuación: 0</p>
            <p id="gameover-theme-msg"></p>
            <div id="gameover-stats"></div>
            <div id="gameover-input-container">
              <p style="color:#ffd700;">¡Puntuación dentro del Top 5!</p>
              <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+">
              <button id="gameover-save" class="game-btn" style="font-size:0.7rem; margin-top:0.3rem;">Guardar</button>
              <p id="name-error" style="color:#ff6b6b; font-size:0.6rem; display:none;">Por favor, ingresa un nombre válido (solo letras).</p>
            </div>
            <button id="gameover-menu-btn" class="game-btn" style="font-size:0.8rem; margin-top:0.5rem; display:none;">🏠 Salir</button>
          </div>
        </div>

        <div id="game-msg">
          <p id="game-msg-text">¡Game Over!</p>
        </div>
      </div>

      <p class="game-help">
        Mueve con dedo, A/D o flechas · <span class="highlight">Pulsa pausa ⏸️</span> para menú<br>
        <span style="font-size:0.7rem; opacity:0.7;">Power-ups: ↑ dureza, ↓ flaqueza, <> pala grande, -< pala mini, x3 multibola, 🌫️ niebla</span>
      </p>
    </div>
  </div>

  <script src="../script-juego.js" type="module"></script>
</body>
</html>
