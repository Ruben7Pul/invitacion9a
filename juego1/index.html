<!DOCTYPE html>
<html lang="es" style="background:#0e0a18;height:100%">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Juego XV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23d4af37' stroke='%23b8860b' stroke-width='3'/><circle cx='35' cy='35' r='6' fill='%23fff' opacity='0.6'/><circle cx='65' cy='65' r='4' fill='%23fff' opacity='0.4'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%;
      overflow:hidden;
      background:#0e0a18;
      font-family:'Cinzel',serif;
    }

    #game-bg-video {
      position:fixed;
      inset:0;
      z-index:0;
      width:100%;
      height:100%;
      object-fit:cover;
      pointer-events:none;
      opacity:1;
      mix-blend-mode:normal;
    }

    @keyframes rainbowScore {
      0% { background-position:0% 50%; }
      100% { background-position:300% 50%; }
    }
    @keyframes heartFade {
      0% { opacity:1; transform:scale(1); }
      50% { opacity:0.5; transform:scale(1.5); color:#ff4444; }
      100% { opacity:0; transform:scale(0); }
    }
    @keyframes floatMsg {
      0% { opacity:0; transform:translate(-50%,30%) scale(0.5); }
      20% { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
      80% { opacity:1; transform:translate(-50%,-60%) scale(1); }
      100% { opacity:0; transform:translate(-50%,-80%) scale(0.8); }
    }
    @keyframes goldenGlow {
      0% { box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.3); transform: translate(-50%, -50%) scale(1); }
      100% { box-shadow: 0 0 60px rgba(255,215,0,1), 0 0 120px rgba(255,215,0,0.5); transform: translate(-50%, -50%) scale(1.1); }
    }

    #loading-veil {
      position:fixed;
      inset:0;
      z-index:999;
      background-color:#0e0a18;
      background-image:url('../archivos/bella.jpg');
      background-size:cover;
      background-position:center;
      opacity:1;
      transition:opacity 0.45s ease;
      pointer-events:none;
    }
    #loading-veil.hide { opacity:0; }

    #game-overlay {
      position:fixed;
      inset:0;
      z-index:90;
      background:rgba(6,4,10,0.3);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      visibility:hidden;
      transition:opacity 0.3s ease, visibility 0.3s ease;
    }
    #game-overlay.open {
      opacity:1;
      visibility:visible;
    }

    #game-panel {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0.4rem;
      transform:scale(0.9);
      opacity:0;
      transition:transform 0.3s ease, opacity 0.3s ease;
      max-width:96vw;
      z-index:10;
      position:relative;
    }
    #game-overlay.open #game-panel {
      transform:scale(1);
      opacity:1;
    }

    /* HEADER: solo vidas y puntuación */
    #game-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      font-family:'Cinzel',serif;
      text-transform:uppercase;
      font-size:clamp(0.7rem,2vw,0.9rem);
      padding:0 0.1rem;
      color:#fae3a0;
      text-shadow:0 0 15px rgba(212,175,55,0.3);
    }
    #game-header .left {
      display:flex;
      align-items:center;
      gap:0.5rem;
    }
    #game-header .right {
      flex:1;
      text-align:right;
    }
    #game-score {
      display:none;
      font-size:clamp(0.7rem,2vw,0.9rem);
      min-width:80px;
      text-align:center;
      flex-shrink:0;
      font-family:'Press Start 2P',monospace;
      background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#9b59b6);
      background-size:300% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      animation:rainbowScore 3s linear infinite;
      text-shadow:none;
    }

    #game-stage {
      position:relative;
      background:#0e0a18;
      border:2px solid #b8860b;
      border-radius:16px;
      overflow:hidden;
      touch-action:none;
      box-shadow:0 0 30px rgba(212,175,55,0.15), inset 0 0 40px rgba(25,60,120,0.2);
      width:100%;
      max-width:450px;
      aspect-ratio:300/420;
    }
    #game-inner {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:2;
    }

    /* ===== FOOTER: BOTONES Y AYUDA ===== */
    #game-footer {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0.3rem;
      width:100%;
      max-width:450px;
      margin-top:0.2rem;
    }
    .footer-buttons {
      display:flex;
      align-items:center;
      gap:0.5rem;
      flex-wrap:wrap;
      justify-content:center;
    }
    .game-btn-sm {
      background:rgba(201,162,77,0.12);
      border:1.5px solid #c9a24d;
      color:#f0d9a3;
      font-size:1.4rem;
      cursor:pointer;
      padding:0.2rem 0.6rem;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:30px;
      box-shadow:0 0 12px rgba(201,162,77,0.15);
      transition:all 0.3s ease;
      min-width:44px;
      height:44px;
      line-height:1;
      font-family:'Cinzel',serif;
      font-weight:600;
    }
    .game-btn-sm:hover {
      background:rgba(201,162,77,0.25);
      box-shadow:0 0 20px rgba(201,162,77,0.3);
      transform:scale(1.05);
    }
    .game-btn-sm:active {
      transform:scale(0.95);
    }
    .game-btn-sm.exit-btn {
      border-color:#b8860b;
      color:#f0d9a3;
      background:rgba(201,162,77,0.08);
    }
    .game-btn-sm.exit-btn:hover {
      background:rgba(201,162,77,0.2);
      border-color:rgba(201,162,77,0.6);
    }
    .game-btn-sm.mute-btn {
      border-color:#4d96ff;
      color:#aac8ff;
      background:rgba(77,150,255,0.08);
    }
    .game-btn-sm.mute-btn:hover {
      background:rgba(77,150,255,0.2);
      border-color:rgba(77,150,255,0.6);
    }
    .game-btn-sm.pause-btn {
      border-color:#ffaa33;
      color:#ffcc88;
      background:rgba(255,170,51,0.08);
    }
    .game-btn-sm.pause-btn:hover {
      background:rgba(255,170,51,0.2);
      border-color:rgba(255,170,51,0.6);
    }

    .game-help {
      font-size:clamp(0.8rem,2vw,1rem);
      opacity:0.95;
      font-family:'Cinzel',serif;
      color:#fae3a0;
      text-shadow:0 0 10px rgba(212,175,55,0.2);
      text-align:center;
      line-height:1.6;
      margin:0;
      padding:0.2rem 0.5rem;
      background:rgba(0,0,0,0.3);
      border-radius:12px;
      border:1px solid rgba(212,175,55,0.15);
      width:100%;
    }
    .game-help .highlight {
      color:#ffd700;
      font-weight:bold;
    }
    .game-help .good {
      color:#4caf50;
    }
    .game-help .bad {
      color:#ff6b6b;
    }
    .game-help .gold {
      color:#ffd700;
    }

    /* GAME OVER */
    #game-menu {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:0.8rem;
      border-radius:16px;
      padding:1rem;
      position:absolute;
      inset:0;
      z-index:50;
      background:rgba(10,7,16,0.9);
      border:2px solid #b8860b;
      box-shadow:inset 0 0 60px rgba(25,60,120,0.3);
      overflow:hidden;
      text-align:center;
    }
    #menu-gameover {
      display:none;
      text-align:center;
      width:100%;
    }
    #menu-gameover p { font-family:'Cinzel',serif; }
    #gameover-score { font-size:1.1rem; color:#fae3a0; }
    #gameover-theme-msg {
      font-family:'Cormorant Garamond','Cinzel',serif;
      font-style:italic;
      font-size:clamp(0.8rem,2.4vw,0.95rem);
      color:#f0d9a3;
      text-shadow:0 0 10px rgba(212,175,55,0.25);
      max-width:280px;
      margin:0.4rem auto 0;
      line-height:1.4;
    }
    #gameover-input-container input {
      font-family:'Press Start 2P',monospace;
      background:#1a1a2e;
      border:2px solid #b8860b;
      border-radius:8px;
      color:white;
      padding:0.4rem;
    }
    #name-error { color:#ff6b6b; font-size:0.6rem; }

    #lives {
      display:none;
      letter-spacing:0.15em;
      font-size:clamp(1rem,3vw,1.3rem);
      color:#ff6b6b;
      text-shadow:0 0 15px #ff6b6b;
    }
    .heart-fade { animation:heartFade 0.6s ease forwards; }

    .game-btn {
      font-family:'Cinzel',serif;
      font-size:clamp(0.8rem,2vw,1rem);
      letter-spacing:0.14em;
      text-transform:uppercase;
      color:#f0d9a3;
      background:rgba(201,162,77,0.15);
      border:1.5px solid rgba(201,162,77,0.4);
      padding:0.5rem 1.2rem;
      border-radius:30px;
      cursor:pointer;
      transition:all 0.3s ease;
      box-shadow:0 0 15px rgba(212,175,55,0.15);
      text-shadow:0 0 8px rgba(201,162,77,0.2);
      backdrop-filter:blur(4px);
    }
    .game-btn:hover {
      background:rgba(201,162,77,0.25);
      border-color:rgba(201,162,77,0.6);
      box-shadow:0 0 25px rgba(212,175,55,0.35);
      transform:translateY(-2px);
    }
    .game-btn:active { transform:translateY(0); background:rgba(201,162,77,0.2); }

    #game-msg {
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:0.5rem;
      background:rgba(10,7,16,0.85);
      text-align:center;
      padding:1rem;
      z-index:50;
    }
    #game-msg.show { display:flex; }
    #game-msg p {
      font-family:'Cinzel',serif;
      color:#fae3a0;
      font-size:clamp(1rem,3vw,1.3rem);
      white-space:pre-line;
      text-shadow:0 0 20px rgba(212,175,55,0.5);
    }

    #loading-tips {
      position:absolute;
      bottom:10px;
      left:50%;
      transform:translateX(-50%);
      z-index:300;
      color:#fae3a0;
      font-family:'Cinzel',serif;
      font-size:0.7rem;
      text-align:center;
      opacity:0.8;
      background:rgba(0,0,0,0.5);
      padding:0.3rem 1rem;
      border-radius:20px;
      backdrop-filter:blur(2px);
      border:1px solid rgba(212,175,55,0.2);
      pointer-events:none;
      transition:opacity 0.5s;
      max-width:90%;
    }
    #loading-tips.hidden { opacity:0; }

    @media (max-width:400px) {
      #game-panel { max-width:98vw; }
      .game-btn-sm { font-size:1.1rem; min-width:38px; height:38px; padding:0.1rem 0.4rem; }
      .game-help { font-size:0.7rem; line-height:1.4; }
      .game-help br { display:block; }
    }
    @media (min-width:768px) {
      #game-stage { max-width:450px; }
      .game-btn-sm { font-size:1.6rem; min-width:50px; height:50px; }
      .game-help { font-size:1.1rem; }
    }
  </style>
</head>
<body style="background:#0e0a18">
  <!-- Video de fondo -->
  <video id="game-bg-video" autoplay loop muted playsinline>
    <source src="../archivos/juegvideo.webm" type="video/webm">
    <source src="../archivos/juegvideo.mp4" type="video/mp4">
  </video>

  <!-- Música de fondo (juegcan.mp3) -->
  <audio id="bg-music" src="../archivos/juegcan.mp3" loop preload="auto"></audio>

  <div id="loading-veil" aria-hidden="true"></div>
  <script>
    setTimeout(function () {
      var veil = document.getElementById('loading-veil');
      if (!veil) return;
      veil.classList.add('hide');
      veil.addEventListener('transitionend', function () {
        veil.style.display = 'none';
      }, { once: true });
    }, 750);
  </script>

  <div id="game-overlay" class="open">
    <div id="game-panel">
      <!-- HEADER: solo vidas y puntuación -->
      <div id="game-header">
        <div class="left">
          <span id="lives">♥ ♥ ♥</span>
          <span id="game-score">0</span>
        </div>
        <div class="right"></div>
      </div>

      <!-- Área de juego -->
      <div id="game-stage">
        <div id="game-inner"></div>
        <div id="game-menu" style="display:none;">
          <div id="menu-gameover">
            <p style="font-size:1.2rem; color:#ff6b6b;">GAME OVER</p>
            <p id="gameover-score">Puntuación: 0</p>
            <p id="gameover-theme-msg"></p>
            <div id="gameover-stats"></div>
            <div id="gameover-input-container">
              <p style="color:#ffd700;">¡Top 3!</p>
              <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+">
              <button id="gameover-save" class="game-btn" style="font-size:0.7rem; margin-top:0.3rem;">Guardar</button>
              <p id="name-error" style="color:#ff6b6b; font-size:0.6rem; display:none;">Por favor, ingresa un nombre válido (solo letras).</p>
            </div>
            <button id="gameover-menu-btn" class="game-btn" style="font-size:0.8rem; margin-top:0.5rem; display:none; margin-left:auto; margin-right:auto; text-align:center;">🔄 Nueva partida</button>
          </div>
        </div>
        <div id="game-msg">
          <p id="game-msg-text">¡Game Over!</p>
        </div>
        <div id="loading-tips" class="hidden"></div>
      </div>

      <!-- FOOTER: BOTONES Y AYUDA -->
      <div id="game-footer">
        <div class="footer-buttons">
          <button class="game-btn-sm mute-btn" id="mute-btn" title="Silenciar/Activar música">🔊</button>
          <button class="game-btn-sm pause-btn" id="pause-btn" title="Pausar/Reanudar">⏸️</button>
          <button class="game-btn-sm exit-btn" id="exit-btn" title="Salir">🚪</button>
        </div>
        <p class="game-help">
          🎮 <span class="highlight">Mueve con dedo, A/D o flechas</span><br>
          💡 <span class="gold">Esferas doradas</span> y <span class="good">verdes</span> son <span class="good">buenas</span>, 
          <span class="bad">rojas son malas</span>. ¡Intenta obtener el mayor puntaje!
        </p>
      </div>
    </div>
  </div>

  <script src="../script-juego.js" type="module"></script>
</body>
</html>
